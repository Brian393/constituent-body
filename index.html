<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Investigaciones asociativas</title>

  <link rel="stylesheet" href="reveal.js/dist/reset.css" />
  <link rel="stylesheet" href="reveal.js/dist/reveal.css" />
  <link rel="stylesheet" href="reveal.js/dist/theme/serif.css" id="theme" />

  <link rel="stylesheet" href="reveal.js/dist/plugin/highlight/monokai.css" id="highlight-theme" />
  <style>
    .reveal .slide-background iframe {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
    }

    .fullscreen-video {
      padding: 0 !important;
      background: #000;
    }

    .fullscreen-video video {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover;
      background: #000;
      display: block;
      margin: 0 auto;
    }
  </style>

</head>

<body>

  <div class="reveal">

    <div class="slides">

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/1_title.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/2_cuencas_lab.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/4_technosphere.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section data-background-iframe="https://player.vimeo.com/video/736493475?autoplay=1&muted=1&background=1#t=157s"
        data-background-interactive data-background-color="#000000">
      </section>

      <section data-background-iframe="https://ecotopia.today/petropolis/map.html" data-background-interactive>
      </section>

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/5_drift.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/6_watershed.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section class="fullscreen-video" data-background-color="#000000" style="height: 100%;">
        <video data-autoplay muted playsinline controls>
          <source
            src="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/mississippi.mp4"
            type="video/mp4">
        </video>
      </section>

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/7_talking_territories.png"
        data-background-size="contain" data-background-color="#000000"></section>

    </div>

  </div>

  <script src="reveal.js/dist/reveal.js"></script>
  <script src="reveal.js/dist/plugin/notes.js"></script>
  <script src="reveal.js/dist/plugin/markdown.js"></script>
  <script src="reveal.js/dist/plugin/highlight.js"></script>
  <script src="reveal.js/dist/plugin/zoom.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealZoom],
    });
  </script>
</body>

</html>
