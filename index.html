<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Investigaciones asociativas</title>

  <link rel="stylesheet" href="reveal.js/dist/reset.css" />
  <link rel="stylesheet" href="reveal.js/dist/reveal.css" />
  <link rel="stylesheet" href="reveal.js/dist/theme/serif.css" id="theme" />

  <link rel="stylesheet" href="reveal.js/plugin/highlight/monokai.css" id="highlight-theme" />

  <style>
    .reveal .slide-background iframe {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
    }
  </style>

</head>

<body>

  <div class="reveal">

    <div class="slides">

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/1_title.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/2_cuencas_lab.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/3_cuencas_lab.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section
        data-background-image="https://s3.us-east-2.amazonaws.com/ecotopia.today/assets/prod/reveal/investigaciones/4_technosphere.png"
        data-background-size="contain" data-background-color="#000000"></section>

      <section data-background-iframe="https://player.vimeo.com/video/736493475?autoplay=1&muted=1&background=1#t=154s"
        data-background-interactive data-background-color="#000000">
      </section>

      <section data-background-iframe="http://ecotopia.today/petropolis/map.html#" data-background-interactive></section>

    </div>

  </div>

  <script src="reveal.js/dist/reveal.js"></script>
  <script src="reveal.js/plugin/notes/notes.js"></script>
  <script src="reveal.js/plugin/markdown/markdown.js"></script>
  <script src="reveal.js/plugin/highlight/highlight.js"></script>
  <script src="reveal.js/plugin/zoom/zoom.js"></script>
  <script>
    // More info about initialization & config:
    // - https://revealjs.com/initialization/
    // - https://revealjs.com/config/
    Reveal.initialize({
      hash: true,

      // Learn about plugins: https://revealjs.com/plugins/
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealZoom],
    });
  </script>
</body>

</html>
