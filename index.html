<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Investigaciones asociativas</title>

  <link rel="stylesheet" href="reveal.js/dist/reset.css" />
  <link rel="stylesheet" href="reveal.js/dist/reveal.css" />
  <link rel="stylesheet" href="reveal.js/dist/theme/serif.css" id="theme" />

  <link rel="stylesheet" href="reveal.js/dist/plugin/highlight/monokai.css" id="highlight-theme" />
  <style>
    .reveal .slide-background iframe {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
    }

    .fullscreen-video {
      padding: 0 !important;
      background: #000;
    }

    .fullscreen-video video {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: contain;
      background: #000;
      display: block;
      margin: 0 auto;
    }
  </style>

</head>

<body>

  <div class="reveal">

    <div class="slides">

      <section data-background-iframe="https://hidinginplainssight.org" data-background-interactive>
      </section>

      <section data-background-iframe=https://hidinginplainssight.org/#/underground/default?center=37.276,-100.458&zoom=7.890&layers=groundwater_level,golden_triangle&sidebar=true&series=wateruse:32" data-background-interactive>

  <script src="reveal.js/dist/plugin/notes.js"></script>
  <script src="reveal.js/dist/plugin/markdown.js"></script>
  <script src="reveal.js/dist/plugin/highlight.js"></script>
  <script src="reveal.js/dist/plugin/zoom.js"></script>

      history: true,
